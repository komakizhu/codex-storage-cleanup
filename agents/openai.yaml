interface:
  display_name: "Codex 存储清理（Codex Storage Cleanup）"
  short_description: "查清 Codex 各处占用，评估可再生内容、旧成果与关联 worktree，并提供独立日报。"
  default_prompt: "Use $codex-storage-cleanup to inspect Codex storage across .codex, Documents, worktrees, and Library. Report the Codex total first, then location and project breakdown, changes, free space, elapsed time, three-category capacity estimates, and plain-language retention advice. When the user asks to run the default cleanup, directly remove verified regenerable caches, compiler/intermediate outputs, and redundant old builds while retaining the latest complete build per project; back up and remove only seven-day-old archives or independently evidenced closed task outputs; and move only associated worktree groups idle over 168 hours after every activity, handle, reference, and Git check passes; a finalization marker never overrides recent or unknown activity, preserving dirty/untracked content, repairing references and Git registration, removing local copies, and retaining old-path symlinks. Keep daily health checks read-only and preserve active or unknown data, sessions, source, unique user outputs, settings, credentials, databases, and worktree roots."
